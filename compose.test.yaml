name: conforto-termico-teste

# PostgreSQL descartável para a suíte de testes (ver AGENTS.md: "Testes de
# models, repositories, serviços com persistência e rotas que gravam dados
# usam PostgreSQL descartável"). Nunca é o banco operacional: nome do
# projeto, porta e volume são todos distintos do `compose.yaml` principal,
# então os dois podem rodar ao mesmo tempo sem conflito. Dados em `tmpfs`
# (nunca tocam disco, somem ao descer o serviço) -- é normal e esperado
# apagar tudo a qualquer momento.
#
# Uso:
#   docker compose -f compose.test.yaml --profile tools build test
#   docker compose -f compose.test.yaml up -d --wait postgres_teste
#   docker compose -f compose.test.yaml --profile tools run --rm test
#   docker compose -f compose.test.yaml down --volumes
#
# (ver README.md, seção "Testes", para o passo a passo completo e o
# equivalente em bash/PowerShell)

services:
  postgres_teste:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_DB: conforto_termico_teste
      POSTGRES_USER: conforto_teste
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password_teste
      TZ: America/Sao_Paulo
    secrets:
      - postgres_password_teste
    ports:
      - "127.0.0.1:${POSTGRES_TESTE_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data:rw,size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conforto_teste -d conforto_termico_teste"]
      interval: 2s
      timeout: 2s
      retries: 15

  test:
    image: conforto-termico:test
    build:
      context: .
      target: quality
      secrets:
        - local_ca
    environment:
      DB_HOST: postgres_teste
      DB_PORT: "5432"
      DB_NAME: conforto_termico_teste
      DB_USER: conforto_teste
      DB_PASSWORD_FILE: /run/secrets/postgres_password_teste
      CONFORTO_TESTING: "1"
      RUFF_CACHE_DIR: /workspace/instance/ruff-cache
      MYPY_CACHE_DIR: /workspace/instance/mypy-cache
      COVERAGE_FILE: /workspace/instance/.coverage
      TZ: America/Sao_Paulo
    secrets:
      - postgres_password_teste
    depends_on:
      postgres_teste:
        condition: service_healthy
    profiles: ["tools"]
    command: ["python", "-m", "unittest", "discover", "-v"]

secrets:
  local_ca:
    file: .certs/local-root-ca.crt
  postgres_password_teste:
    file: .secrets/postgres_password_teste.txt
