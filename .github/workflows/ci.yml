name: CI - Thermal Comfort Control System

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.13"
  POSTGRES_VERSION: "17"

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy types-Flask types-Werkzeug types-requests
      
      - name: Run Ruff linter
        run: ruff check app/ scripts/ *.py
      
      - name: Run Ruff formatter
        run: ruff format --check app/ scripts/ *.py
      
      - name: Run mypy type checker
        run: mypy app/auth.py app/cache.py app/services.py app/thermal_indices.py || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: thermal_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage
      
      - name: Run unit tests (SQLite)
        run: |
          python -m unittest discover tests -v
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Run integration tests (PostgreSQL)
        run: |
          docker compose -f compose.test.yaml up -d
          sleep 5
          export DB_HOST=localhost
          export DB_PASSWORD=testpassword
          export DATABASE_URL=postgresql://postgres:testpassword@localhost:5432/thermal_test
          python -m unittest discover tests -v || true
        continue-on-error: true
      
      - name: Generate coverage report
        run: |
          coverage run -m unittest discover tests
          coverage report --fail-under=70 || true
          coverage html
      
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install pip-audit
        run: pip install pip-audit
      
      - name: Install project dependencies
        run: pip install -r requirements.txt
      
      - name: Run pip-audit
        run: pip-audit || true

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build ICT image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: ict
          load: true
          tags: thermal-ict:latest
      
      - name: Build Coletor image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: coletor
          load: true
          tags: thermal-coletor:latest
