name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "29 4 * * 3"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_REVISION: ${{ github.sha }}
  ARTIFACT_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
  EXPECTED_PLATFORM: linux/arm64

jobs:
  quality:
    name: Qualidade
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/prepare-ci-inputs.sh
      - name: Validar workflow
        run: docker compose -f .github/docker-compose.yml run --rm --no-deps workflow-lint
      - name: Construir e validar candidata única
        run: bash scripts/ci-delivery.sh
      - name: Transferir candidatas sem reconstruir
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-candidates
          path: |
            ${{ runner.temp }}/imagem.tar
            ${{ runner.temp }}/postgres.tar
            ${{ runner.temp }}/candidate.env
          if-no-files-found: error
          retention-days: 3
          compression-level: 1

  runtime-contracts:
    name: Runtime contracts
    needs: quality
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-candidates
          path: ${{ runner.temp }}
      - run: bash scripts/prepare-ci-inputs.sh
      - run: bash scripts/load-candidate.sh
      - name: Contratos e smoke das mesmas imagens
        run: bash scripts/runtime-contracts.sh

  publish:
    name: Publicar artefatos
    needs: [quality, runtime-contracts]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-candidates
          path: ${{ runner.temp }}
      - run: bash scripts/load-candidate.sh
      - name: Publicar por identidade, sem build
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-delivery.sh
