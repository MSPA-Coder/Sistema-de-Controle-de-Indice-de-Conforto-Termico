name: Validacao

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Preparar segredo descartavel de teste
        run: |
          mkdir -p .secrets .certs
          openssl rand -hex 32 > .secrets/postgres_password_teste.txt
          : > .certs/local-root-ca.crt

      - name: Validar Compose de teste
        run: docker compose -f compose.test.yaml --profile tools config --quiet

      - name: Construir imagem de qualidade
        run: docker compose -f compose.test.yaml --profile tools build test

      - name: Subir PostgreSQL descartavel
        run: docker compose -f compose.test.yaml up -d --wait postgres_teste

      - name: Controles críticos primeiro
        run: docker compose -f compose.test.yaml --profile tools run --rm test python -m scripts.run_test_category critical

      - name: Lint e formato
        run: |
          docker compose -f compose.test.yaml --profile tools run --rm test ruff check app scripts tests
          docker compose -f compose.test.yaml --profile tools run --rm test ruff format --check app scripts tests

      - name: Tipagem
        run: docker compose -f compose.test.yaml --profile tools run --rm test mypy app scripts

      - name: Testes e cobertura
        run: docker compose -f compose.test.yaml --profile tools run --rm test sh -c "coverage run -m unittest discover -v && coverage report"

      - name: Encerrar infraestrutura de teste
        if: always()
        run: docker compose -f compose.test.yaml down --volumes --remove-orphans
