name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "29 4 * * 3"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare ephemeral Compose inputs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .certs .secrets
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout /tmp/conforto-ci-local-ca.key \
            -out .certs/local-root-ca.crt \
            -subj "/CN=ConfortoTermico CI ephemeral CA" \
            -days 1
          rm -f /tmp/conforto-ci-local-ca.key
          printf '%s\n' 'ci-placeholder-not-a-real-password' > .secrets/postgres_password.txt
          printf '%s\n' 'ci-placeholder-not-a-real-token' > .secrets/internal_token.txt
          printf '%s' "${{ secrets.SHAREDAUTH_READ_TOKEN }}" > .secrets/github_token.txt

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build quality image
        run: docker compose build --no-cache quality

      - name: Run quality checks
        run: docker compose --profile quality run --rm quality

      # O Dependabot abre PR quando sai versao nova. Nao e a mesma pergunta que
      # "a versao que esta instalada AGORA tem CVE conhecido?" -- e essa segunda
      # ninguem fazia em nenhum dos seis repositorios.
      #
      # Roda dentro da propria imagem `quality`, que ja instala exatamente o que
      # a imagem servida instala, mais as ferramentas de teste. Auditar o
      # ambiente instalado responde a pergunta certa; auditar o arquivo de
      # requisitos responderia sobre o que esta ESCRITO, nao sobre o que esta
      # rodando.
      #
      # Reprova em qualquer achado, de proposito. Vulnerabilidade sem correcao
      # publicada sai por `--ignore-vuln ID` com um comentario dizendo por que:
      # cada excecao vira uma decisao explicita e datada, em vez de um vermelho
      # permanente que se aprende a ignorar.
      # `--cache-dir` em /tmp porque HOME e /app na imagem e /app/.cache nao
      # existe: sem isto o pip-audit morre tentando criar o proprio cache,
      # antes de auditar coisa alguma. Mesmo motivo de RUFF_CACHE_DIR e
      # PYTEST_ADDOPTS ja apontarem para /tmp no Dockerfile.
      - name: Auditar dependencias instaladas (CVE conhecido)
        run: docker compose --profile quality run --rm quality pip-audit --progress-spinner=off --cache-dir /tmp/pip-audit-cache

  runtime-contracts:
    name: Runtime contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare ephemeral Compose inputs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .certs .secrets
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout /tmp/conforto-ci-local-ca.key \
            -out .certs/local-root-ca.crt \
            -subj "/CN=ConfortoTermico CI ephemeral CA" \
            -days 1
          rm -f /tmp/conforto-ci-local-ca.key
          printf '%s\n' 'ci-placeholder-not-a-real-password' > .secrets/postgres_password.txt
          printf '%s\n' 'ci-placeholder-not-a-real-token' > .secrets/internal_token.txt
          printf '%s' "${{ secrets.SHAREDAUTH_READ_TOKEN }}" > .secrets/github_token.txt

      - name: Validate PostgreSQL Compose contract
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --format json > /tmp/compose.json
          python3 - <<'PY'
          import json

          db = json.load(open("/tmp/compose.json", encoding="utf-8"))["services"]["postgres"]
          assert db["user"] == "postgres"
          assert db["read_only"] is True
          assert db["cap_drop"] == ["ALL"]
          assert db["security_opt"] == ["no-new-privileges:true"]
          assert db["pids_limit"] == 256
          assert "/tmp:rw,nosuid,nodev,noexec,mode=1777,size=64m" in db["tmpfs"]
          assert "/var/run/postgresql:rw,nosuid,nodev,noexec,mode=1777,size=16m" in db["tmpfs"]
          PY

      - name: Build and inspect immutable runtime
        shell: bash
        run: |
          set -euo pipefail
          docker compose build --no-cache schema
          image_id="$(docker image inspect --format '{{.Id}}' conforto-termico:local)"
          test -n "$image_id"
          docker run --rm --entrypoint sh "$image_id" -ec '
            test "$(id -u)" != 0
            test ! -w /workspace
            test ! -w /workspace/app
            test ! -w /workspace/config
            test ! -w /workspace/migrations
            test ! -w /workspace/scripts
            for path in /workspace/.secrets /workspace/.certs /workspace/.env /workspace/requirements-dev.txt; do
              test ! -e "$path"
            done
            for tool in gcc make wget; do
              ! command -v "$tool" >/dev/null 2>&1
            done
          '
