name: conforto-termico

x-app-build: &app-build
  context: .
  secrets:
    - local_ca

x-database-url: &database-url
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-conforto}:${POSTGRES_PASSWORD:-conforto_dev_local}@postgres:5432/${POSTGRES_DB:-conforto_termico}
  TZ: America/Sao_Paulo

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conforto_termico}
      POSTGRES_USER: ${POSTGRES_USER:-conforto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conforto_dev_local}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conforto} -d ${POSTGRES_DB:-conforto_termico}"]
      interval: 5s
      timeout: 5s
      retries: 20

  schema:
    image: conforto-termico:local
    build: *app-build
    environment:
      <<: *database-url
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  coletor:
    image: conforto-termico:local
    build: *app-build
    restart: unless-stopped
    environment:
      <<: *database-url
      CONFORTO_HOST: 0.0.0.0
      CONFORTO_PORT: "5000"
      CONFORTO_DEBUG: "0"
      CONFORTO_INTERNO_TOKEN: ${CONFORTO_INTERNO_TOKEN:?Defina CONFORTO_INTERNO_TOKEN em .env.docker}
    expose:
      - "5000"
    volumes:
      - .:/workspace
    depends_on:
      schema:
        condition: service_completed_successfully
    command: ["python", "run_coletor.py"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ict:
    image: conforto-termico:local
    build: *app-build
    restart: unless-stopped
    environment:
      <<: *database-url
      CONFORTO_HOST: 0.0.0.0
      CONFORTO_PORT: "5000"
      CONFORTO_DEBUG: ${CONFORTO_DEBUG:-0}
      CONFORTO_INTERNO_TOKEN: ${CONFORTO_INTERNO_TOKEN:?Defina CONFORTO_INTERNO_TOKEN em .env.docker}
      COLETOR_URL: http://coletor:5000
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    volumes:
      - .:/workspace
      - app_instance:/workspace/instance
    depends_on:
      schema:
        condition: service_completed_successfully
      coletor:
        condition: service_healthy
    command: ["python", "run_ict.py"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/login', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  importar_sqlite:
    profiles: ["tools"]
    image: conforto-termico:local
    build: *app-build
    environment:
      <<: *database-url
    volumes:
      - .:/workspace
      - ./instance:/sqlite:ro
    depends_on:
      schema:
        condition: service_completed_successfully
    command:
      - python
      - scripts/migrar_sqlite_postgres.py
      - --sqlite-dir
      - /sqlite
      - --confirm-reset-postgres
      - --report
      - /workspace/migration_report.json

volumes:
  postgres_data:
  app_instance:

secrets:
  local_ca:
    file: .certs/local-root-ca.crt
