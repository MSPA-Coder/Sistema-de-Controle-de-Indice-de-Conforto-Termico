name: conforto-termico

x-app-build: &app-build
  context: .
  target: runtime
  secrets:
    - local_ca

x-database-environment: &database-environment
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:-conforto_termico}
  DB_USER: ${POSTGRES_USER:-conforto}
  DB_PASSWORD_FILE: /run/secrets/postgres_password
  TZ: America/Sao_Paulo

x-app-security: &app-security
  read_only: true
  pids_limit: 256
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=64m

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    user: postgres
    cpus: 1.0
    mem_limit: 768m
    read_only: true
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=64m
      - /var/run/postgresql:rw,nosuid,nodev,noexec,mode=1777,size=16m
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conforto_termico}
      POSTGRES_USER: ${POSTGRES_USER:-conforto}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: America/Sao_Paulo
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5002}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conforto} -d ${POSTGRES_DB:-conforto_termico}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
      start_interval: 1s
    stop_grace_period: 60s

  schema:
    image: conforto-termico:local
    build: *app-build
    <<: *app-security
    cpus: 0.5
    mem_limit: 512m
    environment:
      <<: *database-environment
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    stop_grace_period: 30s
    logging: *default-logging

  coletor:
    image: conforto-termico:local
    restart: unless-stopped
    init: true
    <<: *app-security
    cpus: 0.5
    mem_limit: 256m
    environment:
      <<: *database-environment
      CONFORTO_HOST: 0.0.0.0
      CONFORTO_PORT: "5000"
      CONFORTO_DEBUG: "0"
      CONFORTO_INTERNO_TOKEN_LEITURA_FILE: /run/secrets/internal_read_token
      CONFORTO_INTERNO_TOKEN_CONTROLE_FILE: /run/secrets/internal_control_token
    secrets:
      - postgres_password
      - internal_read_token
      - internal_control_token
    expose:
      - "5000"
    depends_on:
      schema:
        condition: service_completed_successfully
    command: ["python", "run_coletor.py"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    stop_grace_period: 30s
    logging: *default-logging

  ict:
    image: conforto-termico:local
    restart: unless-stopped
    init: true
    <<: *app-security
    cpus: 1.0
    mem_limit: 256m
    environment:
      <<: *database-environment
      CONFORTO_HOST: 0.0.0.0
      CONFORTO_PORT: "5000"
      CONFORTO_DEBUG: ${CONFORTO_DEBUG:-0}
      CONFORTO_SESSION_COOKIE_NAME: ${CONFORTO_SESSION_COOKIE_NAME:-conforto_session}
      # O PADRÃO É `1`, e não `0`, porque aqui não há escolha de host: a linha
      # `CONFORTO_HOST: 0.0.0.0` logo acima é obrigatória em contêiner --
      # escutar em loopback tornaria a porta publicada inalcançável. E desde
      # 02/09/2026 `app_factory._validar_transporte` recusa a inicialização
      # nessa combinação. Com `0`, portanto, o `ict` simplesmente não subia.
      #
      # O `Secure` não atrapalha o acesso local: navegador trata `127.0.0.1`
      # como origem confiável, então o cookie viaja normalmente em http ali.
      CONFORTO_COOKIE_SEGURO: ${CONFORTO_COOKIE_SEGURO:-1}
      # Sem esta linha o `ProxyFix` fica inerte em produção. O `--env-file` do
      # Compose serve para INTERPOLAR `${VAR}` neste arquivo; ele não injeta
      # nada dentro do contêiner. Só chega ao processo o que estiver listado
      # aqui — e a falha é silenciosa: a variável existe no `.env.docker`, o
      # deploy passa, a aplicação sobe saudável e a proteção simplesmente não
      # existe. Descoberto conferindo o IP no `audit_log` depois de implantar,
      # que ainda mostrava o gateway do Docker.
      #
      # Só no `ict`: é o único serviço atrás do nginx. O `coletor` é API
      # interna e não deve confiar em cabeçalho de proxy nenhum.
      CONFORTO_TRUST_PROXY_HEADERS: ${CONFORTO_TRUST_PROXY_HEADERS:-0}
      CONFORTO_INTERNO_TOKEN_LEITURA_FILE: /run/secrets/internal_read_token
      CONFORTO_INTERNO_TOKEN_CONTROLE_FILE: /run/secrets/internal_control_token
      CONFORTO_SECRET_KEY_FILE: /run/secrets/secret_key
      COLETOR_URL: http://coletor:5000
      # Senha do servidor SMTP (CT-03): NUNCA fica na tabela `configuracoes`
      # -- só host/porta/usuario, que não são segredo. Sem valor por padrão,
      # porque SMTP é recurso opcional (sem ele, o alerta opera em modo
      # simulado). Quem precisar do envio real tem duas formas, na mesma
      # ordem de precedência de `sharedauth.secrets.resolver_segredo`:
      # `SMTP_PASS_FILE` apontando para um segredo montado por fora deste
      # Compose, ou esta variável direta.
      SMTP_PASS: ${SMTP_PASS:-}
    secrets:
      - postgres_password
      - internal_read_token
      - internal_control_token
      - secret_key
    ports:
      - "127.0.0.1:${APP_PORT:-5001}:5000"
    volumes:
      - app_instance:/workspace/instance
    depends_on:
      schema:
        condition: service_completed_successfully
      coletor:
        condition: service_healthy
    command: ["python", "run_ict.py"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    stop_grace_period: 30s
    logging: *default-logging

  # Ruff e a suíte mínima de segurança. Fica atrás de um perfil para não subir
  # junto com a aplicação:
  # `docker compose --profile quality run --build --rm quality`.
  # O `--build` é necessário: este serviço não monta o código do host, e
  # `docker compose run` reutiliza a imagem existente sem reconstruí-la.
  quality:
    build:
      context: .
      target: quality
      secrets:
        - local_ca
    profiles: ["quality"]

volumes:
  postgres_data:
  app_instance:

secrets:
  local_ca:
    file: .certs/local-root-ca.crt
  postgres_password:
    file: .secrets/postgres_password.txt
  internal_read_token:
    file: .secrets/internal_read_token.txt
  internal_control_token:
    file: .secrets/internal_control_token.txt
  # Chave de assinatura de sessão. Só o `ict` monta -- o `coletor` não tem
  # sessão de usuário. Fora de desenvolvimento/teste, a ausência deste segredo
  # impede o ICT de iniciar.
  secret_key:
    file: .secrets/secret_key.txt
