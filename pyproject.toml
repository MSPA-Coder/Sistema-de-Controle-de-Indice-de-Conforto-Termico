# Configuracao de ferramentas do ConfortoTermico.
#
# A secao [tool.ruff] e comum aos quatro projetos do mantenedor; so
# `target-version` e `known-first-party` variam, porque dependem da versao de
# Python da imagem e do layout de pacotes. Mantenha o resto em sincronia.

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", "backups", "instance"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # comprimento de linha: responsabilidade do formatador
]

[tool.ruff.lint.isort]
known-first-party = ["app", "migrations", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
# Migracoes Alembic sao geradas: a ordem de import e as expressoes longas de
# schema vem da ferramenta, e reescreve-las a mao so afasta o arquivo do que
# seria regerado.
"migrations/versions/*.py" = ["E501", "I001"]
# Estes scripts ajustam sys.path antes de importar o pacote da aplicacao.
"scripts/criar_usuario_admin.py" = ["E402"]
"scripts/seed_zonas.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
# Sem isto o pytest coloca `tests/` no sys.path em vez da raiz, e `import app`
# falha dentro do conteiner.
pythonpath = ["."]
