# Mypy configuration for Thermal Comfort Control System
# Gradual typing approach - start with strict=False and increase over time

[mypy]
python_version = 3.13
strict = False
ignore_missing_imports = True
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
no_implicit_optional = True
warn_no_return = True
exclude = ^(migrations/|tests/|_backup_)

# Strict settings for core modules (will be enabled gradually)
[mypy-app.auth]
disallow_untyped_defs = True

[mypy-app.cache]
disallow_untyped_defs = True

[mypy-app.services]
disallow_untyped_defs = True

[mypy-app.thermal_indices]
disallow_untyped_defs = True
