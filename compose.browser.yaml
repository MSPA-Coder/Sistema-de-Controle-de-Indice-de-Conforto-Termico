name: conforto-browser-tests
x-env: &browser-env
  BROWSER_TEST_SERVER: "1"
  PYTHONPATH: /workspace
  TZ: America/Sao_Paulo
  DATABASE_URL: postgresql+psycopg://browser:browser@browser-db:5432/browser_tests
  CONFORTO_TESTING: "1"
  CONFORTO_DEVELOPMENT: "1"
  CONFORTO_SECRET_KEY: synthetic-browser-only-never-operational
  CONFORTO_INTERNO_TOKEN_LEITURA: synthetic-browser-read
  CONFORTO_INTERNO_TOKEN_CONTROLE: synthetic-browser-control
  COLETOR_URL: http://browser-coletor:5000
x-security: &browser-security
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
services:
  browser-db:
    image: ${BROWSER_POSTGRES_IMAGE:-mspa-postgres:17-alpine}
    user: postgres
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: browser_tests
      POSTGRES_USER: browser
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql:mode=1777
      - /var/lib/postgresql/data:uid=70,gid=70,mode=0700,size=512m
    healthcheck:
      test: [CMD, pg_isready, -U, browser, -d, browser_tests]
      interval: 2s
      timeout: 3s
      retries: 30
  browser-web:
    image: ${BROWSER_APP_IMAGE:-conforto-browser-app:local}
    build:
      context: .
      target: runtime
      secrets: [local_ca]
    command: [python, /workspace/browser_server.py]
    volumes:
      - ./tests/browser_server.py:/workspace/browser_server.py:ro
    environment: *browser-env
    <<: *browser-security
    depends_on:
      browser-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5100/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  browser-coletor:
    image: ${BROWSER_APP_IMAGE:-conforto-browser-app:local}
    command: [python, /workspace/browser_coletor.py]
    volumes:
      - ./tests/browser_coletor.py:/workspace/browser_coletor.py:ro
    environment: *browser-env
    <<: *browser-security
    depends_on:
      browser-web:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  browser-tests:
    image: conforto-browser-runner:local
    build:
      context: .
      dockerfile: Dockerfile.browser
      secrets: [local_ca]
    network_mode: service:browser-web
    environment:
      BASE_URL: http://127.0.0.1:5100
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 512m
    tmpfs: [/tmp]
    volumes:
      - ./.browser-results:/results
    depends_on:
      browser-coletor:
        condition: service_healthy
secrets:
  local_ca:
    file: ${BROWSER_CA_FILE:-.certs/local-root-ca.crt}
